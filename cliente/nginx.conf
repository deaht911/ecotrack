server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sirve los .gz pre-comprimidos por vite-plugin-compression
    gzip_static on;
    # Compresión dinámica para lo que no tenga .gz
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets con hash: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
